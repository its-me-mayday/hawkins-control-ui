<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>404 • Hawkins Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    const PROJECT_BASE = "/hawkins-control-ui/";

    const HOME_URL = location.origin + PROJECT_BASE;

    setTimeout(() => location.replace(HOME_URL), 900);
  </script>
  <style>
    :root{
      --bg:#0b0c12; --ink:#e6e7ee; --accent:#ff1133;
    }
    html,body{height:100%}
    body{
      margin:0; display:grid; place-items:center; gap:16px;
      background:
        radial-gradient(80% 60% at 50% 35%, rgba(255,17,51,.06), transparent 60%),
        #0b0c12;
      color:var(--ink); font:14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell;
    }
    .card{
      width:min(560px, 92vw);
      border:1px solid rgba(255,17,51,.35);
      border-radius:16px; padding:20px 18px;
      box-shadow: 0 8px 26px rgba(0,0,0,.55), 0 0 22px rgba(255,17,51,.12);
      background: rgba(9,10,16,.92);
      text-align:center;
    }
    .title{
      letter-spacing:.28em; text-transform:uppercase; font-weight:800;
      color:var(--ink); margin:2px 0 8px; font-size:13px;
    }
    .big{
      font-size:28px; letter-spacing:.04em; margin:0 0 6px;
      color:var(--ink); text-shadow: 0 0 10px rgba(255,17,51,.25);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 8px rgba(255,17,51,.25), 0 0 20px rgba(255,17,51,.12); }
      to   { text-shadow: 0 0 14px rgba(255,17,51,.45), 0 0 28px rgba(255,17,51,.18); }
    }
    .muted{
      color:#9aa0b4; text-transform:uppercase; letter-spacing:.18em; font-size:11px;
      margin-top:8px;
    }
    .btn{
      margin-top:14px; display:inline-block;
      background:var(--accent); color:#07080c; text-decoration:none;
      padding:10px 14px; border-radius:999px; font-weight:700; letter-spacing:.06em;
      box-shadow: 0 0 18px rgba(255,17,51,.35);
    }
    .small{font-size:11px; opacity:.8; margin-top:8px}
    .kbd{padding:.1em .45em; border:1px solid #3a3f52; border-bottom-width:2px; border-radius:6px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Hawkins Control</div>
    <h1 class="big">404 — Lost in the Upside Down</h1>
    <div class="muted">This page doesn’t exist. Warping you back to safety…</div>
    <a class="btn" href="/hawkins-control-ui/">Go Home</a>
    <div class="small">If nothing happens, press the button or hit <span class="kbd">⌘/Ctrl</span> + <span class="kbd">L</span> then paste the home URL.</div>
  </div>
</body>
</html>
